name: Daily Contrarian Stock Monitor

on:
  schedule:
    - cron: "0 22 * * 0-4"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "dashboard.py"
      - "dashboard.trigger"
      - "universe.py"
      - "run_monitor.py"
      - "email_dashboard.py"
      - ".github/workflows/daily.yml"

concurrency:
  group: contrarian-monitor
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh ASX 300-sized universe
        id: universe
        env:
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
        run: |
          mkdir -p reports
          set -o pipefail
          python universe.py 2>&1 | tee reports/universe_refresh.log

      - name: Persist universe diagnostic if refresh fails
        if: failure() && steps.universe.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/universe_refresh.log config/*.csv || true
          git diff --cached --quiet || git commit -m "Record ASX universe refresh failure"
          git push

      - name: Run monitor
        env:
          EMAIL_TO: balkissoc@gmail.com
          SEND_EMAIL: "false"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4o-mini
          AUTO_ASX300: "false"
          MAX_OPENAI_CLASSIFICATIONS: "12"
        run: python run_monitor.py

      - name: Build graphical dashboard
        run: python dashboard.py

      - name: Add report to workflow summary
        if: always()
        run: |
          if [ -f reports/latest_summary.md ]; then
            cat reports/latest_summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No latest_summary.md file was created." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit refreshed universe, report and dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/*.csv index.html reports/*.csv reports/*.md reports/universe_refresh.log || true
          git diff --cached --quiet || git commit -m "Add daily contrarian report"
          git push

      - name: Email dashboard link
        env:
          EMAIL_TO: balkissoc@gmail.com
          EMAIL_FROM: balkissoc@gmail.com
          SMTP_USERNAME: balkissoc@gmail.com
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "587"
          DASHBOARD_URL: https://balkissoc.github.io/contrarian-investing-monitor/
        run: python email_dashboard.py
